apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prefect-server-release
  namespace: prefect
spec:
  interval: 10m
  releaseName: prefect-server
  chart:
    spec:
      chart: prefect-server
      version: 2026.6.5172345
      sourceRef:
        kind: HelmRepository
        name: prefect-repo
        namespace: prefect
  install:
    createNamespace: true
  values:
    postgresql:
      enabled: false
      secret:
        create: false
        name: prefect-postgres-secrets
    server:
      uiConfig:
        prefectUiApiUrl: http://prefect.homelab.local:30080/api