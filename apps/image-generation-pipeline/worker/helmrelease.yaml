---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prefect-worker-release
  namespace: image-generation-pipeline
spec:
  interval: 10m
  releaseName: prefect-worker
  chart:
    spec:
      chart: prefect-worker
      version: 2026.6.18212926
      sourceRef:
        kind: HelmRepository
        name: prefect-repo
        namespace: image-generation-pipeline
  install:
    createNamespace: true
  values:
    worker:
      apiConfig: selfHostedServer
      selfHostedServerApiConfig:
        apiUrl: http://prefect-server.prefect.svc.cluster.local:4200/api
      config:
        workPool: default-pool
        type: kubernetes