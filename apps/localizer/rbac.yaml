---
# Grants the shared CI runner (infrastructure/github-runner, ServiceAccount
# github-runner in namespace github-runners) just enough access to redeploy
# this one app - not cluster-admin, not access to any other namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: localizer-deployer
  namespace: localizer
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: github-runner-localizer-deployer
  namespace: localizer
subjects:
  - kind: ServiceAccount
    name: github-runner
    namespace: github-runners
roleRef:
  kind: Role
  name: localizer-deployer
  apiGroup: rbac.authorization.k8s.io
