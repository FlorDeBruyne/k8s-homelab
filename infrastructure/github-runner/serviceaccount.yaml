---
# Identity for the in-cluster CI runner. It has no permissions of its own -
# each app grants it access explicitly via a Role/RoleBinding in that app's
# own namespace (see apps/localizer/rbac.yaml for the first one). Future
# apps' CI can reuse this same runner/ServiceAccount by adding their own
# scoped Role/RoleBinding rather than standing up another runner.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: github-runner
  namespace: github-runners
