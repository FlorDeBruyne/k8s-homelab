---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: qdrant-release
  namespace: qdrant
spec:
  interval: 10m
  chart:
    spec:
      chart: qdrant
      version: "1.18.2"
      sourceRef:
        kind: HelmRepository
        name: qdrant-repo
        namespace: qdrant
  values:
    replicaCount: 1

    apiKey:
      valueFrom:
        secretKeyRef:
          name: qdrant-api-key
          key: api-key

    persistence:
      size: 50Gi
      storageClassName: longhorn

    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 2Gi

    service:
      type: ClusterIP

  install:
    createNamespace: true
