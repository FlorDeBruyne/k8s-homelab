---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: minio-release
  namespace: minio
spec:
  interval: 10m
  chart:
    spec:
      chart: minio
      version: "5.4.0"
      sourceRef:
        kind: HelmRepository
        name: minio-repo
        namespace: minio
  values:
    mode: standalone
    replicas: 1

    existingSecret: minio-root-credentials

    persistence:
      enabled: true
      storageClass: longhorn
      size: 50Gi

    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 2Gi

    buckets:
      - name: vlam-dataset
        policy: none
        purge: false

    consoleService:
      type: ClusterIP

    service:
      type: ClusterIP
      port: 9000

  install:
    createNamespace: true
