---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: minio-release
  namespace: minio
spec:
  interval: 10m
  chart:
    spec:
      chart: minio
      version: "5.4.0"
      sourceRef:
        kind: HelmRepository
        name: minio-repo
        namespace: minio
  values:
    mode: standalone
    replicas: 1

    existingSecret: minio-root-credentials

    persistence:
      enabled: true
      storageClass: longhorn
      size: 50Gi

    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 2Gi

    buckets:
      - name: vlam-dataset
        policy: none
        purge: false
      # Localizer's listing images. Must be named exactly "images" - every
      # existing listing_images.storage_path value in the database is
      # literally "images/<object key>" (src/database/storing/minio_client.py's
      # default bucket_name), and src/api/storage.py splits the bucket name
      # back out of that column at request time rather than taking it from
      # config - a different bucket name here would 404 every listing photo.
      # Temporary home on Longhorn - TODO once the TrueNAS box is racked,
      # move this bucket's storage there and drop it from this shared
      # instance (see docs/TODO.md in the localizer repo).
      - name: images
        policy: none
        purge: false

    consoleService:
      type: ClusterIP

    service:
      type: ClusterIP
      port: 9000

  install:
    createNamespace: true
